<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
    <a-assets>
      <img id="sky" src="assets/sand.jpg">
      <img id="ball" src="assets/beachball.jpg">
      <img id="sand" src="assets/sandtexture.jpg">
    </a-assets>
      <a-box position="-1 0.5 -3" rotation="0 0 0" src="#sand"></a-box>
      <a-box position="-0.049 0.5 -3" rotation="0 0 0" src="#sand"></a-box>
      <a-box position="-0.5 1 -3" rotation="0 0 0" src="#sand"></a-box>
      <a-sphere position="2 1.25 -5" radius="1.25" src="#ball"></a-sphere>
      <a-sky src="#sky" radius="30"></a-sky>
    </a-scene>
  </body>
</html>
